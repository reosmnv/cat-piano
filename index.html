<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffd6e7">
<title>Мяу-пианино 🐱🎹</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  html,body { margin:0; height:100%; overflow:hidden; font-family: "Comic Sans MS","Trebuchet MS",system-ui,sans-serif; }
  body {
    height:100vh; height:100dvh; /* dvh = реально видимая высота, без панелей Safari */
    background: linear-gradient(160deg,#ffe3ef,#d9f0ff);
    display:flex; flex-direction:column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header { flex:none; display:flex; align-items:center; justify-content:center; gap:10px 16px; flex-wrap:wrap; padding:8px 8px 2px; }
  h1 { margin:0; font-size:clamp(20px,4.5vw,38px); color:#e0457b; text-shadow:2px 2px 0 #fff; white-space:nowrap; }
  .modes { display:flex; gap:6px; }
  .modes[hidden] { display:none; }
  .modes button {
    font:inherit; font-size:clamp(13px,2.4vw,16px); border:none; border-radius:999px;
    padding:7px 14px; background:#fff; color:#e0457b; box-shadow:0 3px 0 #f3a3c2; cursor:pointer;
  }
  .modes button.active { background:#e0457b; color:#fff; }
  .modes button:active { transform:translateY(2px); box-shadow:0 1px 0 #f3a3c2; }

  #stage { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px 8px 10px; }
  #laneWrap { display:none; position:relative; width:min(100%,1000px); flex:0.9 1 0; min-height:0; }
  body.learn #laneWrap { display:block; }
  #lane { position:absolute; inset:0; width:100%; height:100%; }
  #parts {
    position:absolute; inset:0; display:none; flex-wrap:wrap; gap:6px; align-content:center; justify-content:center;
    padding:8px; background:rgba(255,255,255,.75); border-radius:18px; overflow:auto;
  }
  #parts.show { display:flex; }
  #parts .ask { width:100%; text-align:center; color:#e0457b; font-weight:bold; font-size:clamp(14px,2.6vw,18px); }
  #parts button {
    font:inherit; font-size:clamp(12px,2.2vw,15px); border:none; border-radius:999px; padding:6px 12px;
    background:#fff; color:#e0457b; box-shadow:0 3px 0 #f3a3c2; cursor:pointer;
  }
  #parts button.all { background:#e0457b; color:#fff; }
  #piano {
    position:relative; width:min(100%,1000px); flex:1 1 0; min-height:0; max-height:440px;
    background:#7a4a3a; border-radius:20px; padding:12px 8px 8px;
    box-shadow:0 8px 0 #5b3529, 0 14px 24px rgba(0,0,0,.22);
    display:flex; gap:5px; touch-action:none;
  }
  body.learn #piano { border-radius:0 0 20px 20px; padding-top:6px; }

  .key { position:relative; border-radius:0 0 12px 12px; cursor:pointer; touch-action:none; container-type:size; }
  .white {
    flex:1; background:#fffdf8; box-shadow: inset 0 -8px 0 #eadfce;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:7cqh;
    transition: transform .06s, box-shadow .06s;
  }
  .white.on { transform:translateY(3px); box-shadow: inset 0 -3px 0 #eadfce; background:#fff4fa; }
  .black {
    position:absolute; top:0; height:50%; z-index:2;
    background:#2b2230; box-shadow: inset 0 -7px 0 #110c14;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:5cqh;
    transition: transform .06s;
  }
  .black.on { transform:translateY(3px); background:#4a3a52; }
  .cat { height:30cqh; max-width:94cqw; transition: transform .12s cubic-bezier(.3,2,.5,1); }
  .black .cat { height:auto; width:86cqw; max-height:40cqh; }
  .key.on .cat { transform: translateY(-14%) scale(1.12) rotate(-4deg); }
  .cat .mouth-open { display:none; }
  .key.on .cat .mouth-open { display:inline; }
  .key.on .cat .mouth-closed { display:none; }
  .key.on .cat .eye { transform: scaleY(.25); }
  .cat .eye { transform-box: fill-box; transform-origin:center; transition: transform .08s; }
  .label { font-size:min(8cqh,26cqw); line-height:1.1; color:#b98a6a; font-weight:bold; margin-top:1cqh; }
  .black .label { color:#c9b6d4; font-size:min(8cqh,24cqw); }
  .hint { font-size:min(5cqh,16cqw); color:#cbb; }
  .black .hint { color:#776a7d; }
  @container (max-height: 220px) { .hint { display:none; } }

  /* Подсказка в режиме песни: какого котика нажать */
  .key.target::after {
    content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    box-shadow: inset 0 0 0 4px #ff5c9a; animation: glow .7s ease-in-out infinite alternate;
  }
  .key.wrong { animation: shake .25s; }
  @keyframes glow { from { opacity:.35; } to { opacity:1; } }
  @keyframes shake { 25% { transform:translateX(-4px); } 75% { transform:translateX(4px); } }

  .float {
    position:fixed; pointer-events:none; font-weight:bold; color:#e0457b; font-size:clamp(15px,3.5vw,24px);
    text-shadow:2px 2px 0 #fff; animation: rise 1s ease-out forwards; z-index:10; white-space:nowrap;
  }
  @keyframes rise { from { opacity:1; transform:translate(-50%,0) scale(.7); } to { opacity:0; transform:translate(-50%,-90px) scale(1.3); } }

  .overlay {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(255,214,231,.85); z-index:20; padding:16px;
  }
  .overlay.show { display:flex; animation: pop .4s cubic-bezier(.3,1.8,.5,1); }
  .card { background:#fff; border-radius:26px; padding:22px 22px; text-align:center; max-width:420px; box-shadow:0 8px 0 #f3a3c2; }
  .card .big { font-size:min(64px,12vh); animation: beat 1s infinite; }
  .card p { font-size:clamp(18px,4.5vw,28px); color:#e0457b; margin:10px 0 16px; }
  .card button { font:inherit; font-size:18px; border:none; border-radius:999px; padding:10px 22px; background:#e0457b; color:#fff; cursor:pointer; margin:0 4px; }
  @keyframes pop { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
  @keyframes beat { 0%,100% { transform:scale(1); } 50% { transform:scale(1.15); } }

  #rotate { display:none; font-size:13px; color:#a77; text-align:center; padding:0 10px 4px; }
  @media (orientation:portrait) and (max-width:600px) {
    #rotate { display:block; }
    #piano { max-height:46vh; padding:8px 5px 5px; gap:3px; }
  }
  /* Телефон горизонтально: экономим высоту */
  @media (max-height:500px) {
    header { padding:4px 8px 0; }
    h1 { font-size:22px; }
    .modes button { padding:5px 12px; font-size:14px; }
    #stage { padding:4px 8px 8px; }
    #piano { padding:8px 6px 6px; border-radius:16px; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="modes" id="modes" hidden>
    <button data-mode="free" class="active">🎹 Свободно</button>
    <button data-mode="learn" id="learnBtn">🎶 Песня</button>
  </div>
</header>
<div id="rotate">📱↻ Поверни телефон — котикам будет просторнее</div>
<div id="stage">
  <div id="laneWrap"><canvas id="lane"></canvas><div id="parts"></div></div>
  <div id="piano"></div>
</div>

<div class="overlay" id="secret">
  <div class="card">
    <div class="big">😻💕</div>
    <p id="secretText"></p>
    <button data-close>Мур! 🐾</button>
  </div>
</div>
<div class="overlay" id="finish">
  <div class="card">
    <div class="big">🎉😸🎉</div>
    <p>Ура! Песня сыграна!</p>
    <button id="again">Ещё раз 🔁</button>
    <button id="other">Другая часть 🎶</button>
  </div>
</div>

<script src="song-prosto.js"></script>
<script>
// ===================== НАСТРОЙКИ (меняйте тут) =====================
const CONFIG = {
  title: '🐱 Мяу-пианино 🎹',
  // Секретное сообщение появится после N нажатий на котиков
  secretMessage: 'Разработано специально для Ксеши 💖🐱🌸✨',
  secretAfter: 8,
  // Диапазон клавиш
  low: 'C5', high: 'C6',
};
// Звук: настоящее мяуканье, выровненное по высоте.
// Запись «Meow of a pleading cat» (Wikimedia Commons, общественное достояние).
const MEOW_URL = 'sounds/meow.wav';
const MEOW_HZ = 577; // на какой частоте звучит запись

// Песня для режима «Ждёт тебя»: [время в секундах, нота, длительность]
// Подключается из song-prosto.js; нет файла — режим скрыт
const SONG = window.SONG_DATA || null;
// ===================================================================

document.getElementById('title').textContent = CONFIG.title;
document.getElementById('secretText').textContent = CONFIG.secretMessage;

// ---------- Ноты ----------
const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const RU = ['До','До♯','Ре','Ре♯','Ми','Фа','Фа♯','Соль','Соль♯','Ля','Ля♯','Си'];
const midiOf = n => { const m = n.match(/^([A-G]#?)(\d)$/); return NAMES.indexOf(m[1]) + (+m[2] + 1) * 12; };
const nameOf = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);
const freqOf = n => 440 * Math.pow(2, (midiOf(n) - 69) / 12);

const CAT_COLORS = ['#f6a04d','#bfbfbf','#f7e3c4','#3a3a3a','#ffffff','#c98b5a','#9fb4d6'];
// Клавиатура компьютера (по физическим клавишам, раскладка не важна)
const WHITE_CODES = ['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','Quote'];
const UPPER_CODES = ['KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP','BracketLeft','BracketRight'];
const CODE_LABEL = c => ({Semicolon:';',Quote:"'",BracketLeft:'[',BracketRight:']'}[c] || c.slice(3));

function catSVG(color, small) {
  const dark = (color === '#3a3a3a' || small);
  const line = dark ? '#111' : '#5a3a2a';
  const eye = dark ? '#ffd84a' : '#3b2a20';
  return `
  <svg class="cat" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
    <polygon points="12,38 18,2 42,22" fill="${color}" stroke="${line}" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="88,38 82,2 58,22" fill="${color}" stroke="${line}" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="19,30 21,12 34,23" fill="#ffb3c8"/>
    <polygon points="81,30 79,12 66,23" fill="#ffb3c8"/>
    <ellipse cx="50" cy="52" rx="42" ry="35" fill="${color}" stroke="${line}" stroke-width="2.5"/>
    <ellipse class="eye" cx="34" cy="46" rx="6" ry="8" fill="${eye}" stroke="${line}" stroke-width="1.5"/>
    <ellipse class="eye" cx="66" cy="46" rx="6" ry="8" fill="${eye}" stroke="${line}" stroke-width="1.5"/>
    <circle cx="36" cy="43" r="2" fill="#fff"/><circle cx="68" cy="43" r="2" fill="#fff"/>
    <ellipse cx="22" cy="60" rx="6" ry="3.5" fill="#ff8fb1" opacity=".6"/>
    <ellipse cx="78" cy="60" rx="6" ry="3.5" fill="#ff8fb1" opacity=".6"/>
    <polygon points="45,56 55,56 50,62" fill="#ff7aa2"/>
    <path class="mouth-closed" d="M40,66 Q45,71 50,64 Q55,71 60,66" fill="none" stroke="${line}" stroke-width="2.2" stroke-linecap="round"/>
    <g class="mouth-open">
      <path d="M41,64 Q50,62 59,64 Q57,82 50,82 Q43,82 41,64 Z" fill="#7a1f3a" stroke="${line}" stroke-width="2"/>
      <ellipse cx="50" cy="77" rx="5" ry="3.5" fill="#ff7aa2"/>
    </g>
    <g stroke="${line}" stroke-width="1.5" stroke-linecap="round">
      <line x1="4" y1="56" x2="26" y2="59"/><line x1="4" y1="66" x2="26" y2="63"/>
      <line x1="96" y1="56" x2="74" y2="59"/><line x1="96" y1="66" x2="74" y2="63"/>
    </g>
  </svg>`;
}

// ---------- Строим клавиатуру ----------
const piano = document.getElementById('piano');
const KEYS = [];          // { note, el, black, color, afterWhite }
const keyByNote = {}, keyByCode = {};
let whiteCount = 0;
for (let m = midiOf(CONFIG.low); m <= midiOf(CONFIG.high); m++) {
  const note = nameOf(m), black = note.includes('#');
  const el = document.createElement('div');
  el.className = 'key ' + (black ? 'black' : 'white');
  el.dataset.note = note;
  const color = black ? '#2b2230' : CAT_COLORS[whiteCount % CAT_COLORS.length];
  const code = black ? UPPER_CODES[whiteCount] : WHITE_CODES[whiteCount];
  el.innerHTML = catSVG(color, black) + `<div class="label">${RU[m % 12]}</div>` + (code ? `<div class="hint">${CODE_LABEL(code)}</div>` : '');
  piano.appendChild(el);
  const k = { note, el, black, color: black ? '#6b4f7a' : (color === '#ffffff' ? '#f3c6d8' : color), afterWhite: whiteCount - 1 };
  KEYS.push(k); keyByNote[note] = k;
  if (code) keyByCode[code] = note;
  if (!black) whiteCount++;
}
function layoutBlack() {
  const whites = piano.querySelectorAll('.white');
  const pr = piano.getBoundingClientRect();
  const top = parseFloat(getComputedStyle(piano).paddingTop);
  KEYS.filter(k => k.black).forEach(k => {
    const a = whites[k.afterWhite].getBoundingClientRect();
    const b = whites[k.afterWhite + 1].getBoundingClientRect();
    const w = a.width * 0.62;
    k.el.style.width = w + 'px';
    k.el.style.top = top + 'px';
    k.el.style.left = ((a.right + b.left) / 2 - pr.left - w / 2) + 'px';
  });
}
new ResizeObserver(() => { layoutBlack(); resizeLane(); }).observe(piano);
layoutBlack();

// ---------- Звук ----------
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
let meowBuf = null;
fetch(MEOW_URL).then(r => r.arrayBuffer())
  .then(a => new Promise((ok, err) => ctx.decodeAudioData(a, ok, err)))
  .then(b => { meowBuf = b; });

function unlockAudio() {
  // iPhone: играть звук даже при включённом беззвучном режиме
  if (navigator.audioSession) navigator.audioSession.type = 'playback';
  if (ctx.state !== 'running') ctx.resume();
}

const voices = {}; // нота -> звучащий мяу, чтобы повторное нажатие не превращалось в кашу
function meow(note) {
  if (!meowBuf) return;
  const t = ctx.currentTime;
  const old = voices[note];
  if (old) { old.g.gain.setTargetAtTime(0, t, 0.02); old.s.stop(t + 0.1); }
  const s = ctx.createBufferSource();
  s.buffer = meowBuf;
  s.playbackRate.value = freqOf(note) / MEOW_HZ;
  const g = ctx.createGain();
  s.connect(g); g.connect(master);
  s.start(t);
  voices[note] = { s, g };
  s.onended = () => { if (voices[note] && voices[note].s === s) delete voices[note]; };
}

// ---------- Нажатия ----------
const WORDS = ['мяу!', 'мяу~', 'мур!', 'мяяу', 'мрр', 'мяу♪'];
let presses = 0, secretShown = false;

function press(note) {
  const k = keyByNote[note];
  if (!k) return;
  meow(note);
  const el = k.el;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 260);

  const r = el.getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'float';
  f.textContent = WORDS[Math.floor(Math.random() * WORDS.length)];
  f.style.left = (r.left + r.width / 2) + 'px';
  f.style.top = (r.top + r.height * 0.45) + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1000);

  if (mode === 'learn') learnPress(note);

  presses++;
  if (!secretShown && presses >= CONFIG.secretAfter) {
    secretShown = true;
    setTimeout(() => show('secret'), 600);
  }
}

// Мультитач + «глиссандо» пальцем по клавишам
const active = new Map(); // pointerId -> note
function noteAt(x, y) {
  const el = document.elementFromPoint(x, y);
  const key = el && el.closest('.key');
  return key ? key.dataset.note : null;
}
piano.addEventListener('pointerdown', e => {
  e.preventDefault();
  unlockAudio();
  const n = noteAt(e.clientX, e.clientY);
  active.set(e.pointerId, n);
  if (n) press(n);
});
piano.addEventListener('pointermove', e => {
  if (!active.has(e.pointerId)) return;
  const n = noteAt(e.clientX, e.clientY);
  if (n && n !== active.get(e.pointerId)) press(n);
  active.set(e.pointerId, n);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(t =>
  piano.addEventListener(t, e => active.delete(e.pointerId)));
document.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.repeat || e.metaKey || e.ctrlKey) return;
  const n = keyByCode[e.code];
  if (n) { unlockAudio(); press(n); }
});

function show(id) { document.getElementById(id).classList.add('show'); }
document.querySelectorAll('[data-close]').forEach(b =>
  b.addEventListener('click', () => b.closest('.overlay').classList.remove('show')));

// ---------- Режимы ----------
let mode = 'free';
function setMode(m) {
  mode = m;
  document.body.classList.toggle('learn', m === 'learn');
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  stopLearn();
  document.getElementById('parts').classList.toggle('show', m === 'learn');
}
document.querySelectorAll('.modes button').forEach(b =>
  b.addEventListener('click', () => { unlockAudio(); setMode(b.dataset.mode); }));
if (SONG) {
  document.getElementById('modes').hidden = false;
  document.getElementById('learnBtn').textContent = '🎶 ' + SONG.title;
  const box = document.getElementById('parts');
  box.innerHTML = '<div class="ask">Что играем? 🐾</div>';
  [{ name: 'Целиком', from: 0, to: SONG.notes.length, all: true }, ...SONG.parts].forEach(part => {
    const b = document.createElement('button');
    b.textContent = part.name; if (part.all) b.className = 'all';
    b.addEventListener('click', () => { unlockAudio(); box.classList.remove('show'); startLearn(part); });
    box.appendChild(b);
  });
}

// ---------- Режим «Ждёт тебя» ----------
// Ноты падают сверху; дойдя до котика, ждут, пока его нажмут.
const lane = document.getElementById('lane');
const lctx = lane.getContext('2d');
let L = null; // состояние урока

function resizeLane() {
  const r = lane.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  lane.width = Math.round(r.width * dpr); lane.height = Math.round(r.height * dpr);
  lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

let lastPart = null;
function startLearn(part) {
  lastPart = part;
  const notes = SONG.notes.slice(part.from, part.to)
    .filter(([, n]) => keyByNote[n])
    .map(([t, n, d]) => ({ t, n, d, hit: false, hitAt: 0 }));
  // Ноты, звучащие одновременно, — одна «ступенька», нужно нажать все
  const groups = [];
  notes.forEach(x => {
    const g = groups[groups.length - 1];
    if (g && Math.abs(g.t - x.t) < 0.03) g.notes.push(x); else groups.push({ t: x.t, notes: [x] });
  });
  L = { notes, groups, gi: 0, time: groups[0].t - 2.5, last: performance.now(), done: false };
  document.getElementById('finish').classList.remove('show');
  requestAnimationFrame(() => { resizeLane(); requestAnimationFrame(learnFrame); });
}
function stopLearn() {
  L = null;
  KEYS.forEach(k => k.el.classList.remove('target'));
  lctx.clearRect(0, 0, lane.width, lane.height);
}
document.getElementById('again').addEventListener('click', () => {
  document.getElementById('finish').classList.remove('show');
  startLearn(lastPart);
});
document.getElementById('other').addEventListener('click', () => {
  document.getElementById('finish').classList.remove('show');
  stopLearn();
  document.getElementById('parts').classList.add('show');
});

function current() { return L && L.groups[L.gi]; }
function learnPress(note) {
  const g = current();
  if (!g) return;
  const waiting = L.time >= g.t - 0.35; // нота уже почти у котика
  const x = g.notes.find(x => !x.hit && x.n === note);
  if (x && waiting) {
    x.hit = true; x.hitAt = performance.now();
    if (g.notes.every(x => x.hit)) {
      L.time = Math.max(L.time, g.t);
      L.gi++;
      if (L.gi >= L.groups.length) { L.done = true; setTimeout(() => mode === 'learn' && show('finish'), 900); }
    }
  } else if (waiting) {
    const el = keyByNote[note].el;
    el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong');
  }
}

function roundRect(x, y, w, h, r) {
  lctx.beginPath();
  lctx.moveTo(x + r, y); lctx.arcTo(x + w, y, x + w, y + h, r); lctx.arcTo(x + w, y + h, x, y + h, r);
  lctx.arcTo(x, y + h, x, y, r); lctx.arcTo(x, y, x + w, y, r); lctx.closePath();
}

function learnFrame(now) {
  if (!L) return;
  const dt = Math.min(0.1, (now - L.last) / 1000); L.last = now;
  const g = current();
  if (g) L.time = Math.min(L.time + dt, g.t); else L.time += dt;

  // подсветка нужных котиков
  const need = new Set(g && L.time >= g.t - 0.35 ? g.notes.filter(x => !x.hit).map(x => x.n) : []);
  KEYS.forEach(k => k.el.classList.toggle('target', need.has(k.note)));

  const W = lane.clientWidth, H = lane.clientHeight;
  const pps = Math.max(H / 2.2, 90); // пикселей на секунду; не меньше, чтобы ноты подряд не слипались
  lctx.clearRect(0, 0, W, H);
  // дорожки
  lctx.fillStyle = 'rgba(255,255,255,.35)';
  roundRect(0, 0, W, H, 18); lctx.fill();
  const lr = lane.getBoundingClientRect();
  const col = {};
  KEYS.forEach(k => { const r = k.el.getBoundingClientRect(); col[k.note] = [r.left - lr.left, r.width]; });
  KEYS.filter(k => !k.black).forEach(k => {
    const [x] = col[k.note];
    lctx.fillStyle = 'rgba(122,74,58,.08)'; lctx.fillRect(x - 2.5, 0, 1.5, H);
  });
  // линия, где ноты встречают котиков
  lctx.fillStyle = '#ff9cc0'; lctx.fillRect(0, H - 4, W, 4);

  L.notes.forEach(x => {
    const yb = H - (x.t - L.time) * pps;
    const h = Math.max(Math.min(22, 0.32 * pps - 6), x.d * pps - 6);
    if (yb < 0 || (yb - h > H)) return;
    const k = keyByNote[x.n];
    let [cx, cw] = col[x.n];
    const pad = k.black ? 1 : cw * 0.12;
    let alpha = 1, grow = 0;
    if (x.hit) {
      const a = (now - x.hitAt) / 300;
      if (a > 1) return;
      alpha = 1 - a; grow = a * 8;
    }
    lctx.globalAlpha = alpha;
    lctx.fillStyle = k.color;
    lctx.strokeStyle = '#7a4a3a'; lctx.lineWidth = 2;
    roundRect(cx + pad - grow, yb - h - grow, cw - pad * 2 + grow * 2, h + grow * 2, Math.min(12, cw / 3));
    lctx.fill(); lctx.stroke();
    lctx.font = `bold ${Math.min(16, cw * 0.35)}px system-ui`;
    lctx.textAlign = 'center'; lctx.textBaseline = 'bottom';
    lctx.fillStyle = k.color === '#3a3a3a' || k.black ? '#fff' : '#7a4a3a';
    lctx.fillText('🐾', cx + cw / 2, yb - 3);
    lctx.globalAlpha = 1;
  });

  // прогресс
  const total = L.groups.length;
  lctx.fillStyle = '#e0457b';
  lctx.fillRect(0, 0, W * (L.gi / total), 4);
  if (L.time < L.groups[0].t - 0.4) {
    lctx.font = 'bold 18px system-ui'; lctx.textAlign = 'center'; lctx.textBaseline = 'middle';
    lctx.fillStyle = '#e0457b';
    lctx.fillText('Нажимай котика, когда нота до него долетит 🐾', W / 2, H / 3);
  }
  requestAnimationFrame(learnFrame);
}
</script>
</body>
</html>
